<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Tasks</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        .concluida { text-decoration: line-through; color: #6c757d; }
    </style>
</head>
<body class="bg-light">

    <div class="container mt-5" style="max-width: 500px;">
        <div class="card shadow">
            <div class="card-body">
                <h2 class="card-title text-center text-primary mb-4">📝 My Tasks</h2>
                
                <form id="formTarefa" class="input-group mb-3">
                    <input type="text" id="inputTitulo" class="form-control" placeholder="Nova tarefa..." required>
                    <button class="btn btn-primary" type="submit"><i class="bi bi-plus-lg"></i></button>
                </form>

                <ul id="listaTarefas" class="list-group"></ul>
            </div>
        </div>
    </div>

    <script>
        const API = 'http://localhost:3000/api/tarefas';
        const lista = document.getElementById('listaTarefas');
        const form = document.getElementById('formTarefa');
        const input = document.getElementById('inputTitulo');

        async function carregarTarefas() {
            const res = await fetch(API);
            const tarefas = await res.json();
            lista.innerHTML = '';
            
            if(tarefas.length === 0) {
                lista.innerHTML = '<li class="list-group-item text-center text-muted">Nenhuma tarefa! 🎉</li>';
                return;
            }

            tarefas.forEach(t => {
                const li = document.createElement('li');
                li.className = `list-group-item d-flex justify-content-between align-items-center ${t.concluida ? 'list-group-item-light' : ''}`;
                li.innerHTML = `
                    <div class="form-check">
                        <input class="form-check-input me-2" type="checkbox" ${t.concluida ? 'checked' : ''} onclick="alterarStatus(${t.id})">
                        <span class="${t.concluida ? 'concluida' : ''}">${t.titulo}</span>
                    </div>
                    <button class="btn btn-sm btn-outline-danger" onclick="deletar(${t.id})"><i class="bi bi-trash"></i></button>
                `;
                lista.appendChild(li);
            });
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            await fetch(API, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ titulo: input.value })
            });
            input.value = '';
            carregarTarefas();
        });

        async function alterarStatus(id) {
            await fetch(`${API}/${id}`, { method: 'PUT' });
            carregarTarefas();
        }

        async function deletar(id) {
            await fetch(`${API}/${id}`, { method: 'DELETE' });
            carregarTarefas();
        }

        carregarTarefas();
    </script>
</body>
</html>
